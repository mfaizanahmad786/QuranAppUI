<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Khatm</title>
  <script>
    (function () {
      var saved = localStorage.getItem("khatm-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="splash.css" />
  <link rel="stylesheet" href="preview-nav.css" />
</head>
<body>
  <div class="device">
    <div class="phone splash-phone">
      <div class="splash">
        <div class="splash-glow" aria-hidden="true"></div>
        <div class="splash-mark">
          <img src="assets/quran-rehal.png" alt="" width="120" height="120" />
        </div>
        <h1 class="splash-title">Khatm</h1>
        <p class="splash-tagline">Your Quran journey starts here</p>
        <div class="splash-loader" aria-hidden="true">
          <span></span>
        </div>
      </div>
    </div>
  </div>
  <script src="splash.js"></script>
  <script src="preview-nav.js"></script>
</body>
</html>
